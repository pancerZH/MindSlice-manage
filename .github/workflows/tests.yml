name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    # Linux only: the tool runs on the machine that holds the repos, and discover stops leftover processes through /proc.
    # The tests need only git: PyPI is faked, and discover runs a fake harness instead of agy.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"]
    name: unittest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # a regular install, so the tests run against the package as built (prompts/ included)
        run: python -m pip install .
      - name: Tests
        run: PYTHONPATH=tests python -m unittest discover -s tests -t tests -v
